# certificate.yaml

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omni-tls
  namespace: omni
spec:
  secretName: omni-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - omni.sazara.co.ke
    - omni-k8s.sazara.co.ke
    - omni-siderolink.sazara.co.ke
